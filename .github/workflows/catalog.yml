name: Build & deploy skills catalog

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/deploy.py"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate channels (fails if a skill is misconfigured)
        run: python scripts/deploy.py --dry-run
      - name: Build catalog
        run: python scripts/deploy.py --catalog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
